name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Unzip Project
        run: unzip Ehehehehehe.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: cd BluetoothIsimDegistirici && chmod +x gradlew || true

      - name: Build APK
        run: |
          cd BluetoothIsimDegistirici
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: bluetooth-app-apk
          path: BluetoothIsimDegistirici/app/build/outputs/apk/debug/*.apk
