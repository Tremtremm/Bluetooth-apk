name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Unzip Project
        run: |
          unzip -o Ehehehehehe.zip || true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          chmod +x ./BluetoothIsimDegistirici/gradlew || chmod +x ./gradlew || true

      - name: Build with Gradle
        run: |
          if [ -f "./BluetoothIsimDegistirici/gradlew" ]; then
            cd BluetoothIsimDegistirici && ./gradlew assembleDebug --no-daemon
          elif [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: BluetoothIsimDegistirici-APK
          path: "**/outputs/apk/debug/*.apk"
          
